<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura web de tres capes</title>
  <desc id="desc">El navegador arriba al servidor web públic, que deriva la petició al servidor d'aplicacions i aquest consulta la base de dades privada.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b72"/></marker></defs>
  <rect width="1100" height="480" rx="24" fill="#f5f8fa"/>
  <rect x="35" y="55" width="260" height="360" rx="18" fill="#e8f4f7" stroke="#118ab2" stroke-width="3"/>
  <rect x="330" y="55" width="350" height="360" rx="18" fill="#edf7f1" stroke="#06a77d" stroke-width="3"/>
  <rect x="715" y="55" width="350" height="360" rx="18" fill="#fff4e5" stroke="#f4a261" stroke-width="3"/>
  <text x="165" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0b1f33">Presentació</text>
  <text x="165" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#315b72">Client / navegador</text>
  <rect x="85" y="190" width="160" height="100" rx="12" fill="#fff" stroke="#118ab2" stroke-width="2"/>
  <text x="165" y="232" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0b1f33">Navegador</text><text x="165" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">HTTPS :443</text>
  <text x="505" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0b1f33">Lògica</text>
  <text x="505" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#315b72">Frontera i aplicació</text>
  <rect x="375" y="170" width="260" height="80" rx="12" fill="#fff" stroke="#06a77d" stroke-width="2"/><text x="505" y="202" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#0b1f33">Servidor web</text><text x="505" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#315b72">TLS · proxy · fitxers · logs</text>
  <rect x="375" y="285" width="260" height="80" rx="12" fill="#fff" stroke="#06a77d" stroke-width="2"/><text x="505" y="317" text-anchor="middle" font-family="Arial,sans-serif" font-size="19" fill="#0b1f33">Servidor d'aplicacions</text><text x="505" y="343" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#315b72">Lògica · sessions · API</text>
  <text x="890" y="98" text-anchor="middle" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#0b1f33">Dades</text>
  <text x="890" y="132" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#315b72">Xarxa privada</text>
  <rect x="760" y="215" width="260" height="100" rx="12" fill="#fff" stroke="#f4a261" stroke-width="2"/><text x="890" y="254" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" fill="#0b1f33">Base de dades</text><text x="890" y="282" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">Només l'aplicació hi accedeix</text>
  <line x1="245" y1="240" x2="365" y2="240" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"/><line x1="635" y1="325" x2="750" y2="265" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="305" y="218" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">HTTP(S)</text><text x="690" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">SQL</text>
  <text x="550" y="450" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">La frontera pública no ha de coincidir amb la capa de dades</text>
</svg>
