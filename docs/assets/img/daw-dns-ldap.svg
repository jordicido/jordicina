<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 430" role="img" aria-labelledby="title desc">
  <title id="title">DNS i servei de directori en un desplegament</title><desc id="desc">DNS localitza l'aplicació i LDAP proporciona identitats i grups que l'aplicació transforma en permisos.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b72"/></marker></defs><rect width="1100" height="430" rx="24" fill="#f5f8fa"/>
  <rect x="35" y="80" width="220" height="270" rx="16" fill="#e8f4f7" stroke="#118ab2" stroke-width="3"/><text x="145" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Client</text><text x="145" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">app.exemple.test</text><text x="145" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">consulta DNS</text><text x="145" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">→ adreça IP</text>
  <rect x="350" y="80" width="220" height="270" rx="16" fill="#edf7f1" stroke="#06a77d" stroke-width="3"/><text x="460" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">DNS</text><text x="460" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">zona i registres</text><text x="460" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">A / AAAA / CNAME</text><text x="460" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">TTL i memòria cau</text>
  <rect x="665" y="80" width="185" height="270" rx="16" fill="#fff4e5" stroke="#f4a261" stroke-width="3"/><text x="757" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Aplicació</text><text x="757" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">ruta i permisos</text><text x="757" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">consulta identitat</text><text x="757" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">TLS</text>
  <rect x="930" y="80" width="135" height="270" rx="16" fill="#f0ecfa" stroke="#7651a9" stroke-width="3"/><text x="997" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">LDAP</text><text x="997" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">usuaris</text><text x="997" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">grups</text><text x="997" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">atributs</text>
  <g stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"><line x1="260" y1="215" x2="340" y2="215"/><line x1="575" y1="215" x2="655" y2="215"/><line x1="855" y1="215" x2="920" y2="215"/></g><text x="550" y="395" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">DNS resol el nom; LDAP valida identitats; l'aplicació decideix permisos</text>
</svg>
