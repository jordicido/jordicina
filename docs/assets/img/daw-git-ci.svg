<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline de control de versions i integració contínua</title><desc id="desc">El canvi es documenta, es versiona, es revisa, passa proves automàtiques i es prepara per al desplegament.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b72"/></marker></defs><rect width="1100" height="330" rx="24" fill="#f5f8fa"/>
  <g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="100" width="150" height="90" rx="14" fill="#e8f4f7" stroke="#118ab2" stroke-width="3"/><text x="110" y="138" font-size="19" font-weight="700" fill="#0b1f33">Canvi</text><text x="110" y="165" font-size="15" fill="#315b72">codi + docs</text><rect x="230" y="100" width="150" height="90" rx="14" fill="#edf7f1" stroke="#06a77d" stroke-width="3"/><text x="305" y="138" font-size="19" font-weight="700" fill="#0b1f33">Commit</text><text x="305" y="165" font-size="15" fill="#315b72">intenció clara</text><rect x="425" y="100" width="150" height="90" rx="14" fill="#fff4e5" stroke="#f4a261" stroke-width="3"/><text x="500" y="138" font-size="19" font-weight="700" fill="#0b1f33">Revisió</text><text x="500" y="165" font-size="15" fill="#315b72">diff i permisos</text><rect x="620" y="100" width="180" height="90" rx="14" fill="#f0ecfa" stroke="#7651a9" stroke-width="3"/><text x="710" y="138" font-size="19" font-weight="700" fill="#0b1f33">Integració</text><text x="710" y="165" font-size="15" fill="#315b72">proves i anàlisi</text><rect x="845" y="100" width="220" height="90" rx="14" fill="#e6f5e9" stroke="#2e8b57" stroke-width="3"/><text x="955" y="138" font-size="19" font-weight="700" fill="#0b1f33">Artefacte</text><text x="955" y="165" font-size="15" fill="#315b72">preparat per publicar</text></g>
  <g stroke="#315b72" stroke-width="3" marker-end="url(#arrow)"><line x1="190" y1="145" x2="220" y2="145"/><line x1="385" y1="145" x2="415" y2="145"/><line x1="580" y1="145" x2="610" y2="145"/><line x1="805" y1="145" x2="835" y2="145"/></g><text x="550" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">Si falla una comprovació, el canvi no avança fins que l'evidència i la causa estan resoltes</text>
</svg>
