<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" role="img" aria-labelledby="title desc">
  <title id="title">Protocols de transferència d'arxius</title><desc id="desc">Comparació visual entre FTP amb canal de control i dades, FTPS protegit amb TLS i SFTP sobre SSH.</desc>
  <rect width="1100" height="390" rx="24" fill="#f5f8fa"/><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="35" y="55" width="310" height="275" rx="16" fill="#fff4e5" stroke="#f4a261" stroke-width="3"/><text x="190" y="100" font-size="24" font-weight="700" fill="#0b1f33">FTP</text><text x="190" y="135" font-size="16" fill="#315b72">control :21</text><text x="190" y="170" font-size="16" fill="#315b72">dades: ports variables</text><text x="190" y="220" font-size="18" fill="#a44a3f">sense xifrat</text><text x="190" y="265" font-size="15" fill="#315b72">actiu o passiu</text><rect x="395" y="55" width="310" height="275" rx="16" fill="#edf7f1" stroke="#06a77d" stroke-width="3"/><text x="550" y="100" font-size="24" font-weight="700" fill="#0b1f33">FTPS</text><text x="550" y="135" font-size="16" fill="#315b72">FTP + TLS</text><text x="550" y="175" font-size="16" fill="#315b72">control i dades protegides</text><text x="550" y="225" font-size="18" fill="#2e8b57">certificat</text><text x="550" y="265" font-size="15" fill="#315b72">manté el model FTP</text><rect x="755" y="55" width="310" height="275" rx="16" fill="#e8f4f7" stroke="#118ab2" stroke-width="3"/><text x="910" y="100" font-size="24" font-weight="700" fill="#0b1f33">SFTP</text><text x="910" y="135" font-size="16" fill="#315b72">SSH :22</text><text x="910" y="175" font-size="16" fill="#315b72">un canal segur</text><text x="910" y="225" font-size="18" fill="#118ab2">no és FTP</text><text x="910" y="265" font-size="15" fill="#315b72">usuaris i claus SSH</text></g><text x="550" y="365" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">La tria afecta ports, clients, tallafocs, credencials i proves</text>
</svg>
