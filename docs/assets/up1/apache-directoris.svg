<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Directori Apache</title><desc id="desc">Estructura principal de configuració d’Apache en Ubuntu</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Apache en Ubuntu: directoris d’interés</text>
<rect x="80" y="120" width="480" height="500" rx="24" fill="#0f2538"/>
<text x="115" y="175" font-family="Courier New" font-size="25" fill="#f6c85f">/etc/apache2/</text>
<g font-family="Courier New" font-size="23" fill="#ffffff">
<text x="145" y="225">├── apache2.conf</text><text x="145" y="265">├── ports.conf</text><text x="145" y="305">├── mods-available/</text><text x="145" y="345">├── mods-enabled/</text><text x="145" y="385">├── sites-available/</text><text x="145" y="425">└── sites-enabled/</text>
</g>
<rect x="640" y="120" width="480" height="500" rx="24" fill="#f4f8fb" stroke="#24527a" stroke-width="3"/>
<text x="680" y="180" font-family="Courier New" font-size="24" font-weight="700" fill="#17324d">/var/www/html/</text>
<text x="710" y="225" font-family="Courier New" font-size="23" fill="#17324d">└── index.html</text>
<text x="680" y="310" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Conceptes clau</text>
<g font-family="Arial" font-size="20" fill="#4d5d6c">
<text x="700" y="355">• DocumentRoot: arrel dels fitxers web</text>
<text x="700" y="400">• Listen: port d’escolta</text>
<text x="700" y="445">• ServerName: nom del lloc</text>
<text x="700" y="490">• sites-available: configuracions disponibles</text>
<text x="700" y="535">• sites-enabled: llocs habilitats</text>
</g>

</svg>