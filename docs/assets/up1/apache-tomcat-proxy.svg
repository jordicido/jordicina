<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Apache com a proxy invers davant de Tomcat</title><desc id="desc">El client entra per HTTPS a Apache, que reenvia la petició a Tomcat en el port 8080 i aquest accedeix a la base de dades</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker></defs><rect width="1200" height="580" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Apache davant de Tomcat</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="210" width="210" height="130" rx="20" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="165" y="265" font-size="27" font-weight="700" fill="#17324d">Client</text><text x="165" y="305" font-size="19" fill="#4d5d6c">navegador</text><rect x="345" y="190" width="250" height="170" rx="22" fill="#fff6e8" stroke="#d88718" stroke-width="3"/><text x="470" y="250" font-size="29" font-weight="700" fill="#17324d">Apache</text><text x="470" y="290" font-size="20" fill="#4d5d6c">:443 HTTPS</text><text x="470" y="325" font-size="20" fill="#4d5d6c">proxy invers</text><rect x="670" y="190" width="250" height="170" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="795" y="250" font-size="29" font-weight="700" fill="#17324d">Tomcat</text><text x="795" y="290" font-size="20" fill="#4d5d6c">:8080 intern</text><text x="795" y="325" font-size="20" fill="#4d5d6c">WAR / servlets</text><rect x="995" y="210" width="170" height="130" rx="20" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="1080" y="260" font-size="23" font-weight="700" fill="#17324d">BBDD</text><text x="1080" y="305" font-size="18" fill="#4d5d6c">dades</text></g><g stroke="#24527a" stroke-width="5" marker-end="url(#a)"><line x1="270" y1="275" x2="345" y2="275"/><line x1="595" y1="275" x2="670" y2="275"/><line x1="920" y1="275" x2="995" y2="275"/></g><text x="305" y="250" text-anchor="middle" font-family="Arial" font-size="17" fill="#4d5d6c">HTTPS</text><text x="635" y="250" text-anchor="middle" font-family="Arial" font-size="17" fill="#4d5d6c">HTTP intern</text><path d="M995 340 C870 500 520 500 270 340" fill="none" stroke="#5f7f99" stroke-width="4" marker-end="url(#a)"/><text x="650" y="485" text-anchor="middle" font-family="Arial" font-size="21" fill="#4d5d6c">resposta torna pel mateix camí</text></svg>
