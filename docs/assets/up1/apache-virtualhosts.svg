<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc"><title id="title">Virtual Hosts d'Apache</title><desc id="desc">Dos dominis apunten a la mateixa IP i Apache selecciona diferents DocumentRoot segons ServerName</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker></defs><rect width="1200" height="600" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Apache: Virtual Hosts basats en nom</text><g font-family="Arial" text-anchor="middle"><rect x="60" y="160" width="230" height="95" rx="18" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="175" y="217" font-size="25" font-weight="700" fill="#17324d">app1.local</text><rect x="60" y="340" width="230" height="95" rx="18" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="175" y="397" font-size="25" font-weight="700" fill="#17324d">app2.local</text><rect x="420" y="205" width="300" height="190" rx="24" fill="#fff6e8" stroke="#d88718" stroke-width="3"/><text x="570" y="270" font-size="30" font-weight="700" fill="#17324d">Apache :80</text><text x="570" y="315" font-size="20" fill="#4d5d6c">mateixa IP</text><text x="570" y="350" font-size="20" fill="#4d5d6c">tria per Host / ServerName</text><rect x="870" y="145" width="260" height="120" rx="18" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="1000" y="195" font-size="23" font-weight="700" fill="#17324d">/var/www/app1</text><text x="1000" y="230" font-size="18" fill="#4d5d6c">DocumentRoot</text><rect x="870" y="335" width="260" height="120" rx="18" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="1000" y="385" font-size="23" font-weight="700" fill="#17324d">/var/www/app2</text><text x="1000" y="420" font-size="18" fill="#4d5d6c">DocumentRoot</text></g><g stroke="#24527a" stroke-width="4" marker-end="u