<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Arquitectura web</title><desc id="desc">Flux entre navegador, servidor web, servidor d’aplicacions i base de dades</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="65" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Arquitectura web: visió general</text>
<rect x="40" y="250" width="210" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="145.0" y="324.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Client</text><text x="145.0" y="366.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Navegador</text>
<rect x="300" y="250" width="230" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="415.0" y="324.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Servidor web</text><text x="415.0" y="366.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">HTTP/HTTPS</text>
<rect x="600" y="250" width="300" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="750.0" y="324.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Servidor d'aplicacions</text><text x="750.0" y="366.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Lògica de negoci</text>
<rect x="960" y="250" width="200" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="1060.0" y="324.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Base de dades</text><text x="1060.0" y="366.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Persistència</text>
<line x1="250" y1="330" x2="300" y2="330" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="275.0" y="316.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">petició</text><line x1="530" y1="330" x2="600" y2="330" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="565.0" y="316.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">derivació</text><line x1="900" y1="330" x2="960" y2="330" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="930.0" y="316.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">consulta</text>
<path d="M960 385 C900 500 720 520 530 385" fill="none" stroke="#5f7f99" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M600 385 C520 560 280 560 250 385" fill="none" stroke="#5f7f99" stroke-width="3" marker-end="url(#arrow)"/>
<text x="780" y="520" text-anchor="middle" font-family="Arial" font-size="20" fill="#4d5d6c">resposta amb dades</text>
<text x="450" y="575" text-anchor="middle" font-family="Arial" font-size="20" fill="#4d5d6c">HTML / JSON / recursos</text>

</svg>