<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc"><title id="title">Entorns de desplegament</title><desc id="desc">Flux entre desenvolupament, proves i producció amb característiques diferents</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker></defs><rect width="1200" height="560" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Entorns d'una aplicació</text><g font-family="Arial" text-anchor="middle"><rect x="70" y="170" width="280" height="220" rx="24" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="210" y="225" font-size="29" font-weight="700" fill="#17324d">Desenvolupament</text><text x="210" y="275" font-size="20" fill="#4d5d6c">canvis freqüents</text><text x="210" y="310" font-size="20" fill="#4d5d6c">logs detallats</text><text x="210" y="345" font-size="20" fill="#4d5d6c">dades de prova</text><rect x="460" y="170" width="280" height="220" rx="24" fill="#fff6e8" stroke="#d88718" stroke-width="3"/><text x="600" y="225" font-size="29" font-weight="700" fill="#17324d">Proves / Staging</text><text x="600" y="275" font-size="20" fill="#4d5d6c">similar a producció</text><text x="600" y="310" font-size="20" fill="#4d5d6c">validació</text><text x="600" y="345" font-size="20" fill="#4d5d6c">migracions i smoke tests</text><rect x="850" y="170" width="280" height="220" rx="24" fill="#eef6fb" stroke="#24527a" stroke-width="3"/><text x="990" y="225" font-size="29" font-weight="700" fill="#17324d">Producció</text><text x="990" y="275" font-size="20" fill="#4d5d6c">usuaris reals</text><text x="990" y="310" font-size="20" fill="#4d5d6c">seguretat</text><text x="990" y="345" font-size="20" fill="#4d5d6c">estabilitat + monitoratge</text></g><line x1="350" y1="280" x2="460" y2="280" stroke="#24527a" stroke-width="5" marker-end="url(#a)"/><line x1="740" y1="280" x2="850" y2="280" stroke="#24527a" stroke-width="5" marker-end="url(#a)"/><text x="405" y="255" text-anchor="middle" font-family="Arial" font-size="18" fill="#4d5d6c">promoció</text><text x="795" y="255" text-anchor="middle" font-family="Arial" font-size="18" fill="#4d5d6c">versió validada</text><text x="600" y="470" text-anchor="middle" font-family="Arial" font-size="22" fill="#17324d">Mateix codi · configuració i dades adaptades a cada entorn</text></svg>
