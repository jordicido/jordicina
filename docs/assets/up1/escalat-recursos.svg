<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">Escalabilitat vertical i horitzontal</title><desc id="desc">Comparació entre augmentar recursos d'una màquina i afegir més instàncies amb balancejador</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker></defs><rect width="1200" height="650" fill="#fff"/><text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Escalabilitat: vertical vs horitzontal</text><line x1="600" y1="105" x2="600" y2="585" stroke="#d7e2ea" stroke-width="3"/>
