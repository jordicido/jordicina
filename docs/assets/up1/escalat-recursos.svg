<rect x="800" y="175" width="200" height="90" rx="18" fill="#fff6e8" stroke="#d88718" stroke-width="3"/><text x="900" y="230" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#17324d">Balancejador</text><g fill="#eef6fb" stroke="#24527a" stroke-width="3"><rect x="675" y="380" width="170" height="105" rx="18"/><rect x="860" y="380" width="170" height="105" rx="18"/><rect x="1045" y="380" width="120" height="105" rx="18"/></g><g font-family="Arial" font-size="22" font-weight="700" fill="#17324d" text-anchor="middle"><text x="760" y="443">App 1</text><text x="945" y="443">App 2</text><text x="1105" y="443">App 3</text></g><g stroke="#24527a" stroke-width="4" marker-end="url(#a)"><line x1="900" y1="265" x2="760" y2="380"/><line x1="900" y1="265" x2="945" y2="380"/><line x1="900" y1="265" x2="1105" y2="380"/></g>
