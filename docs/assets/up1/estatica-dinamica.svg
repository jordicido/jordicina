<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Pàgines estàtiques i dinàmiques</title><desc id="desc">Comparació del flux d’una pàgina estàtica i una pàgina dinàmica</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="60" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Pàgina estàtica vs pàgina dinàmica</text>
<rect x="70" y="120" width="480" height="500" rx="28" fill="#f4f8fb" stroke="#24527a" stroke-width="3"/>
<rect x="650" y="120" width="480" height="500" rx="28" fill="#f4f8fb" stroke="#24527a" stroke-width="3"/>
<text x="310" y="180" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#17324d">ESTÀTICA</text>
<text x="890" y="180" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#17324d">DINÀMICA</text>
<rect x="155" y="235" width="310" height="105" rx="22" fill="#ffffff" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="310.0" y="281.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Fitxer HTML</text><text x="310.0" y="323.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">ja preparat</text>
<line x1="310" y1="340" x2="310" y2="440" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="310.0" y="376.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">servix</text>
<rect x="155" y="440" width="310" height="105" rx="22" fill="#ffffff" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="310.0" y="486.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Navegador</text><text x="310.0" y="528.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">mateix contingut</text>
<rect x="735" y="220" width="310" height="95" rx="22" fill="#ffffff" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="890.0" y="261.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Navegador</text><text x="890.0" y="303.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">petició</text>
<line x1="890" y1="315" x2="890" y2="365" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="735" y="365" width="310" height="95" rx="22" fill="#ffffff" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="890.0" y="406.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Backend</text><text x="890.0" y="448.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">executa codi</text>
<line x1="890" y1="460" x2="890" y2="510" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="735" y="510" width="310" height="75" rx="22" fill="#ffffff" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="890.0" y="541.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#17324d">Resposta</text><text x="890.0" y="583.5" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">contingut generat</text>

</svg>