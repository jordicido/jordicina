<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Estructura i recursos</title><desc id="desc">Frontend, backend, base de dades i recursos complementaris</desc>
<defs>
