<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Flux URL DNS HTTP</title><desc id="desc">Passos des de la URL fins a la resposta del servidor</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Què passa quan escrivim una URL?</text>
<rect x="60" y="145" width="220" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="170.0" y="199.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">1. URL</text><text x="170.0" y="241.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">https://exemple.org</text>
<rect x="370" y="145" width="220" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="480.0" y="199.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">2. DNS</text><text x="480.0" y="241.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">nom → IP</text>
<rect x="680" y="145" width="220" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="790.0" y="199.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">3. Servidor</text><text x="790.0" y="241.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">HTTP/HTTPS</text>
<rect x="950" y="145" width="190" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="1045.0" y="199.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">4. Resposta</text><text x="1045.0" y="241.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">HTML / dades</text>
<line x1="280" y1="205" x2="370" y2="205" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><line x1="590" y1="205" x2="680" y2="205" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><line x1="900" y1="205" x2="950" y2="205" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/>
<rect x="115" y="375" width="970" height="200" rx="24" fill="#eef6fb" stroke="#9ab8cc" stroke-width="2"/>
<text x="600" y="425" text-anchor="middle" font-family="Arial" font-size="26" font-weight="700" fill="#17324d">Anatomia d’una URL</text>
<text x="600" y="485" text-anchor="middle" font-family="Courier New" font-size="28" fill="#17324d">https://www.exemple.org:443/productes?id=7#detall</text>
<text x="205" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#4d5d6c">esquema</text>
<text x="455" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#4d5d6c">FQDN</text>
<text x="650" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#4d5d6c">port</text>
<text x="775" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#4d5d6c">ruta</text>
<text x="930" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#4d5d6c">consulta</text>
<text x="1045" y="535" text-anchor="middle" font-family="Arial" font-size="19" fill="#4d5d6c">fragment</text>

</svg>