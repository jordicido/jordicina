<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Model Vista Controlador</title><desc id="desc">Relació conceptual entre model, controlador i vista</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Patró MVC</text>
<rect x="110" y="240" width="250" height="150" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="235.0" y="309.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Model</text><text x="235.0" y="351.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">dades i persistència</text>
<rect x="475" y="90" width="250" height="150" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="159.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Controlador</text><text x="600.0" y="201.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">coordina el flux</text>
<rect x="840" y="240" width="250" height="150" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="965.0" y="309.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Vista</text><text x="965.0" y="351.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">interfície d’usuari</text>
<line x1="360" y1="275" x2="500" y2="205" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="430.0" y="226.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">dades</text><line x1="700" y1="205" x2="840" y2="275" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="770.0" y="226.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">actualitza</text>
<path d="M970 390 C970 540 230 540 230 390" fill="none" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="21" fill="#24527a">accions de l’usuari → controlador → model → vista</text>

</svg>