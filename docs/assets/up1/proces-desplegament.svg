<text x="135.0" y="229.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#17324d">Codi</text><text x="135.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Git</text>
<rect x="260" y="175" width="170" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="345.0" y="229.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Preparació</text><text x="345.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">dependències</text>
<rect x="470" y="175" width="170" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="555.0" y="229.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Proves</text><text x="555.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">funció · seguretat</text>
<rect x="680" y="175" width="170" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="765.0" y="229.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#17324d">Desplegament</text><text x="765.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">entorn</text>
<rect x="890" y="175" width="170" height="120" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="975.0" y="229.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="700" fill="#17324d">Producció</text><text x="975.0" y="271.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">usuaris</text>
<line x1="220" y1="235" x2="260" y2="235" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><line x1="430" y1="235" x2="470" y2="235" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><line x1="640" y1="235" x2="680" y2="235" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><line x1="850" y1="235" x2="890" y2="235" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/>
<path d="M975 300 C990 445 805 510 650 510 C500 510 330 470 330 350" fill="none" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/>
<text x="670" y="485" text-anchor="middle" font-family="Arial" font-size="21" fill="#24527a">monitoratge · logs · alertes · manteniment</text>
<rect x="310" y="560" width="580" height="70" rx="18" fill="#eef6fb" stroke="#9ab8cc"/>
<text x="600" y="604" text-anchor="middle" font-family="Arial" font-size="23" font-weight="700" fill="#17324d">Documentar i poder repetir el procés és part del desplegament</text>

