<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Procés de desplegament</title><desc id="desc">Flux des del codi fins a producció i monitoratge</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Procés de desplegament d’una aplicació web</text>
