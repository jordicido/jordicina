<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Tomcat en tres capes</title><desc id="desc">Arquitectura amb servidor web, Tomcat i base de dades</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#24527a"/></marker>
  <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="6" flood-opacity="0.15"/></filter>
</defs>
<rect width="100%" height="100%" fill="#ffffff"/>

<text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="38" font-weight="700" fill="#17324d">Servidor d’aplicacions en una arquitectura de tres capes</text>
<rect x="80" y="210" width="250" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="205.0" y="284.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Capa 1</text><text x="205.0" y="326.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Servidor web / frontend</text>
<rect x="475" y="210" width="250" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="600.0" y="284.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Capa 2</text><text x="600.0" y="326.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Tomcat / aplicació</text>
<rect x="870" y="210" width="250" height="160" rx="22" fill="#eef6fb" stroke="#24527a" stroke-width="3" filter="url(#shadow)"/>
<text x="995.0" y="284.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17324d">Capa 3</text><text x="995.0" y="326.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#4d5d6c">Base de dades</text>
<line x1="330" y1="290" x2="475" y2="290" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="402.5" y="276.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">petició</text><line x1="725" y1="290" x2="870" y2="290" stroke="#24527a" stroke-width="4" marker-end="url(#arrow)"/><text x="797.5" y="276.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="18" fill="#24527a">consulta</text>
<path d="M870 350 C810 470 760 470 725 350" fill="none" stroke="#5f7f99" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M475 350 C420 520 350 520 330 350" fill="none" stroke="#5f7f99" stroke-width="3" marker-end="url(#arrow)"/>
<text x="600" y="520" text-anchor="middle" font-family="Arial" font-size="24" fill="#4d5d6c">Tomcat executa la lògica Java i gestiona servlets / aplicacions web</text>

</svg>