<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="330" viewBox="0 0 1100 330" role="img" aria-labelledby="title desc">
  <title id="title">Valors límit de la validació d’edat</title>
  <desc id="desc">Recta orientativa amb els valors -1, 0, 17, 18, 19, 120 i 121.</desc>
  <rect width="1100" height="330" fill="#ffffff"/>
  <text x="550" y="45" text-anchor="middle" font-family="Arial" font-size="28" font-weight="700" fill="#17324d">Recta de valors límit</text>
  <line x1="95" y1="170" x2="1005" y2="170" stroke="#24527a" stroke-width="5"/>
  <g stroke="#24527a" stroke-width="3" font-family="Arial" text-anchor="middle" font-size="18" fill="#17324d">
    <line x1="130" y1="145" x2="130" y2="195"/><text x="130" y="230">-1</text>
    <line x1="270" y1="145" x2="270" y2="195"/><text x="270" y="230">0</text>
    <line x1="410" y1="145" x2="410" y2="195"/><text x="410" y="230">17</text>
    <line x1="550" y1="135" x2="550" y2="205" stroke="#d88718" stroke-width="5"/><text x="550" y="230" font-weight="700">18</text>
    <line x1="690" y1="145" x2="690" y2="195"/><text x="690" y="230">19</text>
    <line x1="830" y1="145" x2="830" y2="195"/><text x="830" y="230">120</text>
    <line x1="970" y1="145" x2="970" y2="195"/><text x="970" y="230">121</text>
  </g>
  <path d="M270 105 H830" stroke="#3a8c61" stroke-width="12" stroke-linecap="round"/>
  <text x="550" y="92" text-anchor="middle" font-family="Arial" font-size="18" fill="#245d40">rang vàlid: 0…120</text>
  <path d="M550 270 H830" stroke="#d88718" stroke-width="8" stroke-linecap="round"/>
  <text x="690" y="300" text-anchor="middle" font-family="Arial" font-size="17" fill="#8c5b0c">accés: 18…120</text>
</svg>
