<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc">
  <title id="title">Fitxa d’incidència</title>
  <desc id="desc">Esquema d’una incidència amb títol, entorn, passos, esperat, observat i prioritat.</desc>
  <rect width="1100" height="520" fill="#ffffff"/>
  <text x="550" y="46" text-anchor="middle" font-family="Arial" font-size="29" font-weight="700" fill="#17324d">Fitxa d’incidència reproduïble</text>
  <rect x="55" y="80" width="990" height="365" rx="18" fill="#f8fbfd" stroke="#24527a" stroke-width="3"/>
  <g font-family="Arial" fill="#17324d"><text x="90" y="125" font-size="22" font-weight="700">INC-ED-001 · Mitjana trunca els decimals</text><text x="90" y="165" font-size="18">Entorn: JDK 17 · versió 1.0.0 · dades fictícies</text><text x="90" y="215" font-size="18" font-weight="700">Passos</text><text x="120" y="250" font-size="17">1. Crear [5, 6, 8]   2. Cridar mitjana()   3. Mostrar el retorn</text><text x="90" y="305" font-size="18" font-weight="700" fill="#245d40">Esperat</text><text x="250" y="305" font-family="monospace" font-size="18">6.3333…</text><text x="90" y="345" font-size="18" font-weight="700" fill="#8c3227">Observat</text><text x="250" y="345" font-family="monospace" font-size="18">6.0</text><text x="690" y="305" font-size="18" font-weight="700">Gravetat</text><text x="850" y="305" font-size="18">Mitjana/alta</text><text x="690" y="345" font-size="18" font-weight="700">Prioritat</text><text x="850" y="345" font-size="18">Alta</text><text x="90" y="410" font-size="17" fill="#4d5d6c">Evidència: eixida de consola + cas de prova + hipòtesi tècnica</text></g>
  <text x="550" y="485" text-anchor="middle" font-family="Arial" font-size="18" fill="#4d5d6c">Un bon títol ja orienta la investigació; els passos permeten repetir-la.</text>
</svg>
