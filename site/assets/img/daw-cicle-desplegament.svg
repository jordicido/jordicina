<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 480" role="img" aria-labelledby="title desc">
  <title id="title">Cicle de desplegament i verificació</title>
  <desc id="desc">Cicle amb les fases requisits, disseny, preparació, configuració, desplegament, verificació i documentació.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#315b72"/>
    </marker>
  </defs>
  <rect width="1100" height="480" rx="24" fill="#f5f8fa"/>
  <text x="550" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#0b1f33">Cicle d'una implantació web</text>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="18" font-weight="700" fill="#0b1f33" stroke-width="2">
    <rect x="80" y="110" width="190" height="72" rx="14" fill="#e8f4f7" stroke="#118ab2"/>
    <rect x="330" y="110" width="190" height="72" rx="14" fill="#e8f4f7" stroke="#118ab2"/>
    <rect x="580" y="110" width="190" height="72" rx="14" fill="#edf7f1" stroke="#06a77d"/>
    <rect x="830" y="110" width="190" height="72" rx="14" fill="#edf7f1" stroke="#06a77d"/>
    <rect x="830" y="300" width="190" height="72" rx="14" fill="#fff4df" stroke="#f4a261"/>
    <rect x="580" y="300" width="190" height="72" rx="14" fill="#fff4df" stroke="#f4a261"/>
    <rect x="330" y="300" width="190" height="72" rx="14" fill="#fbe9e7" stroke="#d1495b"/>
  </g>
  <g font-family="Arial,sans-serif" text-anchor="middle" font-size="18" fill="#0b1f33">
    <text x="175" y="153">1. Requisits</text>
    <text x="425" y="153">2. Disseny</text>
    <text x="675" y="153">3. Preparació</text>
    <text x="925" y="153">4. Configuració</text>
    <text x="925" y="343">5. Desplegament</text>
    <text x="675" y="343">6. Verificació</text>
    <text x="425" y="343">7. Documentació</text>
  </g>
  <g fill="none" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)">
    <path d="M270 146 H320"/><path d="M520 146 H570"/><path d="M770 146 H820"/>
    <path d="M925 182 V290"/><path d="M830 336 H780"/><path d="M580 336 H530"/>
    <path d="M330 336 C190 336 150 270 150 190"/>
  </g>
  <path d="M675 300 C675 235 590 215 500 215 C410 215 330 235 330 300" fill="none" stroke="#d1495b" stroke-width="3" stroke-dasharray="10 8" marker-end="url(#arrow)"/>
  <text x="550" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#8d2636">Si falla, torna a la fase afectada i registra la hipòtesi</text>
  <text x="550" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">Una implantació és reproduïble quan es pot posar en marxa, comprovar i recuperar</text>
</svg>
