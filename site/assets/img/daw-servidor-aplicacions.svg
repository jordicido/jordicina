<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 430" role="img" aria-labelledby="title desc">
  <title id="title">Cooperació entre servidor web i servidor d'aplicacions</title><desc id="desc">El client arriba al servidor web públic i les rutes dinàmiques es deriven al servidor d'aplicacions intern.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b72"/></marker></defs><rect width="1050" height="430" rx="24" fill="#f5f8fa"/>
  <rect x="35" y="85" width="190" height="240" rx="16" fill="#e8f4f7" stroke="#118ab2" stroke-width="3"/><text x="130" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Client</text><text x="130" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">GET /</text><text x="130" y="220" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">GET /api</text><text x="130" y="260" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#315b72">HTTPS :443</text>
  <rect x="300" y="45" width="300" height="320" rx="16" fill="#edf7f1" stroke="#06a77d" stroke-width="3"/><text x="450" y="95" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Servidor web</text><text x="450" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">TLS · rutes · recursos estàtics</text><rect x="350" y="185" width="200" height="70" rx="10" fill="#fff" stroke="#06a77d"/><text x="450" y="228" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0b1f33">Proxy invers</text><text x="450" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#315b72">serveix fitxers o deriva</text>
  <rect x="675" y="85" width="330" height="240" rx="16" fill="#fff4e5" stroke="#f4a261" stroke-width="3"/><text x="840" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Aplicació interna</text><text x="840" y="175" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">Runtime · sessions · lògica</text><text x="840" y="215" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">configuració i secrets</text><text x="840" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">connexió a dades</text>
  <line x1="230" y1="205" x2="290" y2="205" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"/><line x1="605" y1="205" x2="665" y2="205" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"/><text x="635" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#315b72">xarxa interna</text><text x="525" y="405" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">El servidor d'aplicacions no necessita ser públic per poder servir l'aplicació</text>
</svg>
