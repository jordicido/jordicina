<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" role="img" aria-labelledby="title desc">
  <title id="title">Servidor web com a frontera de publicació</title><desc id="desc">El client arriba al servidor web, que valida, publica recursos o deriva la petició a l'aplicació.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#315b72"/></marker></defs>
  <rect width="1000" height="410" rx="24" fill="#f5f8fa"/>
  <rect x="35" y="55" width="185" height="280" rx="16" fill="#e8f4f7" stroke="#118ab2" stroke-width="3"/><text x="127" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Client</text><text x="127" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">HTTP(S)</text><rect x="70" y="180" width="115" height="70" rx="10" fill="#fff" stroke="#118ab2" stroke-width="2"/><text x="127" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#0b1f33">Navegador</text>
  <rect x="285" y="35" width="375" height="320" rx="16" fill="#edf7f1" stroke="#06a77d" stroke-width="3"/><text x="472" y="80" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Servidor web</text><text x="472" y="110" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">Frontera pública</text>
  <rect x="325" y="145" width="295" height="55" rx="10" fill="#fff" stroke="#06a77d"/><text x="472" y="180" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0b1f33">TLS · autenticació · límits</text><rect x="325" y="215" width="140" height="70" rx="10" fill="#fff" stroke="#06a77d"/><text x="395" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0b1f33">Fitxers</text><text x="395" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#315b72">estàtics</text><rect x="480" y="215" width="140" height="70" rx="10" fill="#fff" stroke="#06a77d"/><text x="550" y="255" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#0b1f33">Proxy</text><text x="550" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#315b72">a l'aplicació</text>
  <rect x="725" y="55" width="240" height="280" rx="16" fill="#fff4e5" stroke="#f4a261" stroke-width="3"/><text x="845" y="100" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#0b1f33">Evidències</text><text x="845" y="150" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">logs d'accés</text><text x="845" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">logs d'error</text><text x="845" y="230" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#315b72">estat i mètriques</text><text x="845" y="270" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#315b72">configuració validada</text>
  <line x1="225" y1="195" x2="275" y2="195" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"/><line x1="665" y1="195" x2="715" y2="195" stroke="#315b72" stroke-width="4" marker-end="url(#arrow)"/><text x="500" y="385" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">Publica només el que cal i registra el que passa</text>
</svg>
