<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="title desc">
  <title id="title">Màquina virtual i contenidor</title><desc id="desc">Comparació visual de les capes d'una màquina virtual i d'un contenidor.</desc>
  <rect width="1000" height="420" rx="24" fill="#f5f8fa"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="250" y="48" font-size="25" font-weight="700" fill="#0b1f33">Màquina virtual</text><text x="750" y="48" font-size="25" font-weight="700" fill="#0b1f33">Contenidor</text></g>
  <g stroke-width="2"><rect x="55" y="75" width="390" height="55" rx="10" fill="#e8f4f7" stroke="#118ab2"/><rect x="55" y="138" width="390" height="55" rx="10" fill="#d9e8ed" stroke="#118ab2"/><rect x="55" y="201" width="390" height="55" rx="10" fill="#c8dce3" stroke="#118ab2"/><rect x="55" y="264" width="390" height="55" rx="10" fill="#b5d0d9" stroke="#118ab2"/><rect x="55" y="327" width="390" height="45" rx="10" fill="#9fc2ce" stroke="#118ab2"/>
  <rect x="555" y="75" width="390" height="55" rx="10" fill="#edf7f1" stroke="#06a77d"/><rect x="555" y="138" width="390" height="55" rx="10" fill="#d9eee4" stroke="#06a77d"/><rect x="555" y="201" width="390" height="55" rx="10" fill="#c5e5d5" stroke="#06a77d"/><rect x="555" y="264" width="390" height="55" rx="10" fill="#b0dcc4" stroke="#06a77d"/><rect x="555" y="327" width="390" height="45" rx="10" fill="#98ceb0" stroke="#06a77d"/></g>
  <g font-family="Arial,sans-serif" text-anchor="middle" fill="#0b1f33"><text x="250" y="110" font-size="18">Aplicació</text><text x="250" y="173" font-size="18">Sistema operatiu convidat</text><text x="250" y="236" font-size="18">Maquinari virtual</text><text x="250" y="299" font-size="18">Hipervisor</text><text x="250" y="356" font-size="18">Maquinari amfitrió</text><text x="750" y="110" font-size="18">Aplicació</text><text x="750" y="173" font-size="18">Dependències i fitxers</text><text x="750" y="236" font-size="18">Runtime de contenidors</text><text x="750" y="299" font-size="18">Sistema operatiu amfitrió</text><text x="750" y="356" font-size="18">Maquinari amfitrió</text></g>
  <text x="500" y="402" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#315b72">La virtualització facilita l'aïllament, però no elimina la responsabilitat de revisar versions, permisos i xarxa</text>
</svg>
